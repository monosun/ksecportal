spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/secportal?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:secportal}
    password: ${SPRING_DATASOURCE_PASSWORD:secportal123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariPool-secportal
      register-mbeans: true
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:60000}
      validation-timeout: 5000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  servlet:
    multipart:
      # 이미지가 많은 발표자료(PPT)는 수십 MB를 넘기는 경우가 많아 100MB 로 둔다. nginx client_max_body_size 와 함께 맞춰야 한다.
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@secportal.io}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

notification:
  overdue-check-cron: ${NOTIFICATION_CRON:0 0 9 * * MON-FRI}
  from-address: ${MAIL_USERNAME:noreply@secportal.io}

# 관련 사이트(보안 가이드 및 자료) 내용 자동 수집 주기
relatedsite:
  refresh-cron: ${RELATED_SITE_CRON:0 10 7 * * *}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080/api}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  preview:
    # 오피스 문서(PPT·DOC 등)를 PDF 로 바꿔 화면에서 미리보기 하기 위한 변환 서버(Gotenberg).
    # 비워 두면 변환 미리보기가 꺼지고 "다운로드해 확인" 안내만 나간다.
    convert-url: ${DOC_CONVERT_URL:http://gotenberg:3000}
    # 이미지가 많은 발표자료는 변환에만 수십 초가 걸린다
    timeout-seconds: ${DOC_CONVERT_TIMEOUT:120}
    max-file-mb: ${DOC_CONVERT_MAX_MB:80}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173}
  privacy:
    # 개인정보 컬럼 암호화(AES-256-GCM) — 정보주체·수탁사 담당자 정보에 적용된다.
    # 키를 비워 두면 Jasypt 마스터 키를 사용한다. 키를 잃으면 암호문은 복구할 수 없다.
    column-encryption:
      enabled: ${PI_COLUMN_ENCRYPTION_ENABLED:true}
      key: ${PI_ENCRYPTION_KEY:}

backup:
  directory: ${BACKUP_DIR:./backups}

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:dev-local-key}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    string-output-type: base64

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    # 용량 초과로 거절한 요청도 본문을 끝까지 읽어야 오류 응답(413)이 브라우저에 전달된다.
    # -1 이 아니면 연결이 끊겨 사용자에게는 원인 없는 네트워크 오류로만 보인다.
    max-swallow-size: -1
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  server:
    port: -1

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}

okta:
  enabled: ${OKTA_ENABLED:false}
  client-id: ${OKTA_CLIENT_ID:}
  issuer: ${OKTA_ISSUER:}
  redirect-uri: ${OKTA_REDIRECT_URI:http://localhost:5173/auth/okta/callback}

logging:
  level:
    com.monosun.secportal: INFO
    org.springframework.security: WARN
