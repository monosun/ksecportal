# nginx http-level 보안 설정 (/etc/nginx/conf.d/ 에 포함)
# server {} 블록 밖에서 선언해야 하는 http-level 지시어

server_tokens off;

# Rate limiting zones
# auth: 로그인 등 인증 경로 — IP당 분당 5회
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
# upload: 파일 업로드 경로 — IP당 분당 10회
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
# api: 일반 API — IP당 초당 30회
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# trap: 허니팟(함정) 경로 — 백엔드 보호용, IP당 초당 5회
limit_req_zone $binary_remote_addr zone=trap:10m rate=5r/s;

# 속도 제한(429)에 걸린 요청 중 약 10%만 백엔드 공격 탐지에 보고한다(표본).
# 전부 넘기면 차단된 요청이 그대로 백엔드 부하가 되므로 표본만 보낸다 — BehaviorAnalyzer 가 ×10 으로 추정.
split_clients "${remote_addr}${request_id}" $rl_report {
    10%     1;
    *       0;
}
