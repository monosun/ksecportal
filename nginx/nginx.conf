server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ── 업로드 크기 제한 ──────────────────────────────────────────
    # 백엔드 spring.servlet.multipart.max-file-size 와 같은 값으로 맞춘다
    client_max_body_size 100m;

    # ── 타임아웃 ─────────────────────────────────────────────────
    # 대용량 발표자료 업로드 중 본문 수신이 끊기지 않도록 여유를 둔다
    client_body_timeout    60s;
    client_header_timeout  10s;
    keepalive_timeout      65s;
    send_timeout           10s;

    # ── 압축 ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── Server 헤더 완전 제거 (headers-more 모듈) ─────────────────
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';

    # ── 보안 헤더 ────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header X-XSS-Protection          "1; mode=block"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content-Security-Policy: 운영 환경 도메인에 맞게 connect-src를 조정하세요.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
        always;
    # HTTPS 적용 후 아래 줄을 활성화하세요.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── 에러 페이지 ──────────────────────────────────────────────
    error_page 400 /error-pages/400.html;
    error_page 403 /error-pages/403.html;
    error_page 404 /error-pages/404.html;
    # 429 는 표본을 공격 탐지에 보고한 뒤 JSON 으로 응답한다(@rate_limited)
    error_page 429 = @rate_limited;
    error_page 500 /error-pages/500.html;
    error_page 502 /error-pages/502.html;
    error_page 503 /error-pages/503.html;
    error_page 504 /error-pages/504.html;

    location ^~ /error-pages/ {
        internal;
        root /usr/share/nginx/html;
    }

    # ── 공격 탐지: 허니팟(함정) 경로 ─────────────────────────────
    # 백엔드 함정 엔드포인트는 외부에서 직접 부를 수 없다 — 아래 함정 location 만 rewrite 로 넘긴다
    location ^~ /api/detect-trap {
        return 404;
    }

    # 공격 도구가 흔히 찔러 보는 경로(설정 파일·VCS·CMS 관리 페이지 등) → 탐지 후 404
    location ~* /\.(?:env|git|svn|hg|htaccess|htpasswd|aws|ssh|DS_Store|idea|vscode)(?:/|$|\.) {
        rewrite ^ /api/detect-trap/scan break;
        proxy_pass http://backend:8080;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Trap-Path      $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        limit_req zone=trap burst=20 nodelay;
        limit_req_status 429;
    }
    location ~* ^/(?:api/)?(?:wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|myadmin|server-status|server-info|cgi-bin|vendor/phpunit|boaform|HNAP1|admin\.php|administrator|config\.(?:json|php|ya?ml)|backup\.(?:sql|zip|tar\.gz|tgz)|(?:db|dump|database)\.sql|web\.config|swagger-ui(?:\.html)?|v2/api-docs|v3/api-docs|graphql|console|jolokia|heapdump|env)(?:/|$) {
        rewrite ^ /api/detect-trap/scan break;
        proxy_pass http://backend:8080;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Trap-Path      $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        limit_req zone=trap burst=20 nodelay;
        limit_req_status 429;
    }
    # actuator 전체 차단(health 제외) — 접근 시도 자체를 탐지
    location ^~ /api/actuator/ {
        rewrite ^ /api/detect-trap/scan break;
        proxy_pass http://backend:8080;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Trap-Path      $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        limit_req zone=trap burst=20 nodelay;
        limit_req_status 429;
    }

    # robots.txt Disallow·화면에 보이지 않는 링크로만 알 수 있는 미끼 경로 → 가짜 관리 콘솔(허니토큰·AI 에이전트 미끼 지시문 포함)
    location = /api/internal/agent-handshake {
        rewrite ^ /api/detect-trap/agent break;
        proxy_pass http://backend:8080;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Trap-Path      $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        limit_req zone=trap burst=20 nodelay;
        limit_req_status 429;
    }
    location ^~ /api/internal/ {
        rewrite ^ /api/detect-trap/bait break;
        proxy_pass http://backend:8080;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Trap-Path      $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        limit_req zone=trap burst=20 nodelay;
        limit_req_status 429;
    }
    location ^~ /internal-admin {
        rewrite ^ /api/detect-trap/bait break;
        proxy_pass http://backend:8080;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Trap-Path      $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        limit_req zone=trap burst=20 nodelay;
        limit_req_status 429;
    }

    # 속도 제한 초과 응답 — 약 10% 표본만 백엔드 공격 탐지에 보고
    location @rate_limited {
        default_type application/json;
        if ($rl_report = 0) {
            return 429 '{"success":false,"message":"요청이 너무 많습니다. 잠시 후 다시 시도하세요.","data":null}';
        }
        rewrite ^ /api/detect-trap/ratelimit break;
        proxy_pass http://backend:8080;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Trap-Path      $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
    }
    location = /api/actuator/health {
        proxy_pass http://backend:8080/api/actuator/health;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── Rate limiting: 인증 경로 ─────────────────────────────────
    location = /api/auth/login {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/auth/login;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/register {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/auth/register;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Rate limiting: 파일 업로드 경로 ─────────────────────────
    location ~* ^/api/.+/files(/)?$ {
        limit_req zone=upload burst=5 nodelay;
        limit_req_status 429;

        client_max_body_size 100m;
        proxy_pass http://backend:8080;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 보안문서 오피스 파일 미리보기(PDF 변환) ──────────────────
    # LibreOffice 변환은 첫 요청에서 수십 초가 걸릴 수 있어 일반 API(30초)보다 길게 둔다
    location ~* ^/api/sec-docs/[0-9]+/preview$ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
    }

    # ── Rate limiting: 일반 API ───────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # ── 정적 자산 캐싱 ───────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── SPA fallback ─────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }
}
